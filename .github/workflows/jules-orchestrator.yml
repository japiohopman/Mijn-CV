name: Jules Queue Orchestrator

# Event-driven ROADMAP dispatcher with a scheduled recovery heartbeat.
# Changes to the queue definition or orchestrator itself on the repository's
# default branch wake the queue. The scheduler remains the safety net.

on:
  push:
    branches:
      - master
    paths:
      - 'ROADMAP.md'
      - '.github/workflows/jules-orchestrator.yml'
      - 'scripts/jules-orchestrator.mjs'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: jules-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run orchestrator
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JULES_SOURCE: sources/github/${{ github.repository }}
          JULES_STARTING_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/jules-orchestrator.mjs
