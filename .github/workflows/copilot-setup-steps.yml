name: Copilot Setup Steps

# Deterministic environment bootstrap for GitHub Copilot cloud agents.
# This workflow contains setup only; orchestration state belongs to Jules workflows/issues.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  # GitHub Copilot uses this exact job name for the development-environment setup.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify development toolchain
        run: |
          node --version
          npm --version
          test -f package.json
          test -d node_modules

      - name: Verify project test entrypoint
        run: node -e "const p=require('./package.json'); if (!p.scripts?.test) throw new Error('package.json is missing the test script'); console.log('test script:', p.scripts.test)"
