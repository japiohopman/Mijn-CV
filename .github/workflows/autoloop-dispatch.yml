name: Development Autoloop Dispatch (Plan-Only)

on:
  workflow_dispatch:
    inputs:
      confirm_repository:
        description: "Exact owner/repository shown in this repository URL."
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: autoloop-plan-only
  cancel-in-progress: false

jobs:
  autoloop-plan:
    name: Run Autoloop preflight and candidate selection (plan-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify default branch ref
        if: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          echo "::error::Autoloop plan-only can only run from the repository default branch."
          exit 1
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository confirmation
        env:
          CONFIRM_REPOSITORY: ${{ inputs.confirm_repository }}
        run: |
          if [ "$CONFIRM_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Repository confirmation must exactly match this repository."
            exit 1
          fi
      - name: Run Autoloop plan-only preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          CONFIRM_REPOSITORY: __CONFIRM_REPOSITORY__
          AUTOLOOP_STATE_BRANCH: ${{ vars.AUTOLOOP_STATE_BRANCH || 'autoloop-state' }}
          AUTOLOOP_CONFIG_PATH: config/autoloop.json
          AUTOLOOP_LIVE_DISPATCH: 'false'
        run: node scripts/autoloop-runner.mjs
