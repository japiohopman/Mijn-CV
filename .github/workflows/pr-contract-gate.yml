# Installed in a consuming repository, this workflow checks a PR handoff.
# It is not the Jules dispatcher and never approves or merges.
name: Autoloop PR contract gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  check_suite:
    types: [completed]

# PR content is untrusted. Privileged logic is checked out from the trusted base
# SHA (or default branch for check_suite events). Only read permissions are needed.
permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

jobs:
  evaluate:
    name: Evaluate trusted metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    steps:
      - name: Check out trusted base-branch code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify trusted gate implementation is installed
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "scripts/pr-contract-gate.mjs"
            "src/pr-gate.mjs"
            "src/contracts.mjs"
            "src/config.mjs"
            "config/autoloop.schema.v1.json"
          )
          for path in "${required_files[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "::error title=Trusted gate bootstrap pending::Missing trusted file '$path' on the checked-out base revision."
              echo "This is a fail-closed bootstrap error. Do not execute code from the pull-request head and do not treat this run as a successful evaluation."
              exit 1
            fi
          done

      - name: Evaluate PR contract using read-only GitHub metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTOLOOP_CONFIG_PATH: config/autoloop.json
        run: node scripts/pr-contract-gate.mjs
